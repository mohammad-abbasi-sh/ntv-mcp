[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntv-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for n-tv news (n-tv.de) — headlines, markets, videos & articles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
ntv-mcp = "ntv_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ntv_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.n-tv.de site"]
